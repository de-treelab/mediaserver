on:
  push:

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/semantic-version
        with:
          is_beta: ${{ github.ref_name != 'main' }}

  lint-server:
    name: Lint Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./server
        run: npm install

      - name: Lint
        working-directory: ./server
        run: npm run lint:check

      - name: Style
        working-directory: ./server
        run: npm run style:check

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint
        working-directory: ./frontend
        run: npm run lint:check

      - name: Style
        working-directory: ./frontend
        run: npm run style:check

  build-server:
    name: Build Server
    needs: lint-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./server
        run: npm install

      - name: Build
        working-directory: ./server
        run: npm run build

      - name: Pre-pull Postgres test image
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && exit 0
            echo "pull failed, retrying in 10s ($i/3)..."
            sleep 10
          done
          echo "Could not pull postgres:16-alpine after 3 attempts" >&2
          exit 1

      - name: Run tests
        working-directory: ./server
        run: npm test

  build-frontend:
    name: Build Frontend
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build
        working-directory: ./frontend
        run: npm run build

  build-plugin-types:
    name: Build Plugin Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install backend plugin types
        working-directory: ./plugin/backend-types
        run: npm install

      - name: Install frontend plugin types
        working-directory: ./plugin/frontend-types
        run: npm install

      - name: Install create-plugin dependencies
        working-directory: ./plugin/create-plugin
        run: npm install

      - name: Check plugin folder dirty state
        run: |
          if [[ -n "$(git status --porcelain plugin/)" ]]; then
            echo "Plugin folder is dirty. Please commit the changes."
            git status plugin/
            exit 1
          fi

      - name: Build create-plugin
        working-directory: ./plugin/create-plugin
        run: npm run build

      - name: Verify create-plugin scaffold compiles against local types
        env:
          WS: ${{ github.workspace }}
          CREATE_PLUGIN_NAME: scaffold
          CREATE_PLUGIN_AUTHOR: ci
          CREATE_PLUGIN_INIT_GIT: 'no'
          CREATE_PLUGIN_CONFIRM: 'yes'
        run: |
          set -e
          GEN_ROOT="$(mktemp -d)"
          # Run the generator non-interactively (answers come from CREATE_PLUGIN_* env vars).
          CREATE_PLUGIN_DIR="$GEN_ROOT" node "$WS/plugin/create-plugin/dist/index.js"
          for sub in frontend backend theme; do
            echo "::group::build scaffold/$sub"
            cd "$GEN_ROOT/scaffold/$sub"
            # Replace the published plugin-types dependency with the in-repo source
            # so the scaffold is validated against the current (uncommitted) types.
            if [ "$sub" = "backend" ]; then
              npm install -D "file:$WS/plugin/backend-types"
            else
              npm install -D "file:$WS/plugin/frontend-types"
            fi
            npm run build
            cd "$WS"
            echo "::endgroup::"
          done
          rm -rf "$GEN_ROOT"

      - name: Build sample backend plugin
        working-directory: ./plugin/sample/backend
        run: |
          npm install
          npm run build

      - name: Build sample frontend plugin
        working-directory: ./plugin/sample/frontend
        run: |
          npm install
          npm run build

  docker-server:
    name: Docker Server (build)
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: ./server
          file: ./server/Dockerfile

  docker-frontend:
    name: Docker Frontend (build)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          file: ./frontend/Dockerfile
