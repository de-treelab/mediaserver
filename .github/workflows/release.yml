on:
  pull_request:
    branches:
      - main
      - develop
  merge_group:

permissions:
  contents: write
  id-token: write

jobs:
  version:
    name: Compute Version
    if: github.event_name != 'pull_request' || github.event.action == 'enqueued'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/semantic-version
        id: version
        with:
          is_beta: ${{ github.ref_name != 'main' }}

  docker-server:
    name: Docker Server
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            COMMITHASH=${{ github.sha }}
          tags: |
            treelabmediaserver/mediaserver-backend:${{ needs.version.outputs.version }}
            treelabmediaserver/mediaserver-backend:${{ github.ref_name == 'main' && 'stable' || 'unstable' }}
            ${{ github.ref_name == 'main' && 'treelabmediaserver/mediaserver-backend:latest' || '' }}

  docker-frontend:
    name: Docker Frontend
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            treelabmediaserver/mediaserver-web:${{ needs.version.outputs.version }}
            treelabmediaserver/mediaserver-web:${{ github.ref_name == 'main' && 'stable' || 'unstable' }}
            ${{ github.ref_name == 'main' && 'treelabmediaserver/mediaserver-web:latest' || '' }}

  publish-npm:
    name: Publish NPM
    needs: [version, docker-server, docker-frontend]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish frontend plugin types
        run: |
          cd frontend
          npm install
          cd ../plugin/frontend-types
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version
          npm install
          npm publish --provenance --ignore-scripts --access public ${{
            github.ref_name == 'main' && '--tag stable' || '--tag beta'
          }} || exit 0

      - name: Publish backend plugin types
        run: |
          cd server
          npm install
          cd ../plugin/backend-types
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version
          npm install
          npm publish --provenance --ignore-scripts --access public ${{
            github.ref_name == 'main' && '--tag stable' || '--tag beta'
          }} || exit 0

      - name: Publish plugin creation tool
        run: |
          cd plugin/create-plugin
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version
          npm install
          npm run build
          npm publish --provenance --access public ${{
            github.ref_name == 'main' && '--tag stable' || '--tag beta'
          }} || exit 0

  release:
    name: Release
    needs: [docker-server, docker-frontend, publish-npm]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          if echo "${{ join(needs.*.result, ' ') }}" | grep -qE 'failure|cancelled'; then
            exit 1
          fi
